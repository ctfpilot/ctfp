apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: redis-replication
  namespace: ${namespace}
spec:
  clusterSize: ${replication_size}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  sentinel:
    size: ${replication_size}
    image: quay.io/opstree/redis-sentinel:v7.4.8
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    failoverTimeout: 5000
    downAfterMilliseconds: 2000
    # Sentinel-specific Redis auth secret. If omitted, the operator falls back
    # to spec.kubernetesConfig.redisSecret.
    # redisSecret:
    #   name: redis-secret
    #   key: password

    # Pod placement: keep Sentinel pods away from the Redis replication pods so
    # a single node failure cannot remove a Redis member and a Sentinel at once.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - redis-replication-s
            topologyKey: kubernetes.io/hostname
    # Spread the Sentinels across nodes.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            role: sentinel
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.8
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 101m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
    updateStrategy:
      type: RollingUpdate
    redisSecret:
      name: redis-secret
      key: password
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.84.0
    imagePullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
  env:
    - name: REDIS_EXPORTER_INCL_SYSTEM_METRICS
      value: "true"
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 2
    successThreshold: 1
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 15
    periodSeconds: 2
    successThreshold: 1
    timeoutSeconds: 1
  storage:
    volumeClaimTemplate:
      spec:
        # storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
