apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-monitoring-cluster-${namespace}
  namespace: prometheus
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: ctfpilot
    ctfpilot.com/component: platform
    release: prometheus
    redis-operator: "true"
spec:
  selector:
    matchLabels:
      redis_setup_type: cluster
  endpoints:
    - port: redis-exporter
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - ${namespace}
